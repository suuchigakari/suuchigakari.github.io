# GitHub Pages に静的サイトをそのまま公開する。
# 有効にするには リポジトリの Settings → Pages → Source を "GitHub Actions" にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # アップロードと公開を別のジョブに分ける（GitHub の標準のひな形と同じ形）。
  # 同じジョブで続けて行うと、公開の手順がアップロード直後のファイルを見つけられずに
  # 失敗することがあった（2026-11-23、「No artifacts named "github-pages"」）。
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jekyll の処理を無効にする
        run: touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
